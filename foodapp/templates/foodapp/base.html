{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Food Delivery
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/restaurants.css' %}"
    >

</head>

<body>

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{% url 'home' %}"
        >
            🍲 FoodDelivery
        </a>

        <div>

            <a
                href="{% url 'home' %}"
                class="btn btn-outline-light me-2"
            >
                Home
            </a>

            <a
                href="{% url 'order_list' %}"
                class="btn btn-warning"
            >
                🛍 Orders
            </a>

        </div>

    </div>

</nav>


<div class="container py-5">

    {% block content %}
    {% endblock %}

</div>

</body>

</html>
