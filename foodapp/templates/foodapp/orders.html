{% extends 'foodapp/base.html' %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">
        🛍️ Your Orders
    </h2>

    {% for order in orders %}

        <div class="card mb-3">
            <div class="card-body">

                <h5 class="card-title">
                    {{ order.food_item }}
                </h5>

                <p class="card-text">
                    Customer: {{ order.customer_name }}
                </p>

                <p class="card-text">
                    Quantity: {{ order.quantity }}
                </p>

            </div>
        </div>

    {% empty %}

        <p>No orders found.</p>

    {% endfor %}

</div>

{% endblock %}
