{% extends 'foodapp/base.html' %}
{% block content %}

<h2 class="mb-4">🍔 Menu</h2>

<div class="row">
{% for item in items %}
    <div class="col-md-4">
        <div class="card p-3 mb-3 shadow">
            <img src="{{ item.image.url }}" class="img-fluid">
            <h4 class="mt-2">{{ item.name }}</h4>
            <p>₹{{ item.price }}</p>
            <a href="/order/{{ item.id }}/" class="btn btn-success">Order Now</a>
        </div>
    </div>
{% endfor %}
</div>
{% endblock %}
