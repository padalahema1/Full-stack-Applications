{% extends "foodapp/base.html" %}

{% block content %}

<div class="order-page">

    <div class="order-card">

        <!-- Heading -->

        <div class="order-title">

            <div class="food-circle">
                🍔
            </div>

            <div>
                <h1>Place Your Order</h1>

                <p>
                    Complete your order details
                </p>
            </div>

        </div>


        <!-- Form -->

        <form method="POST">

            {% csrf_token %}


            <!-- Customer Name -->

            <div class="form-group">

                <label>
                    👤 Customer Name
                </label>

                <input
                    type="text"
                    name="customer_name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <!-- Quantity -->

            <div class="form-group">

                <label>
                    🔢 Quantity
                </label>

                <input
                    type="number"
                    name="quantity"
                    value="1"
                    min="1"
                    required
                >

            </div>


            <!-- Total -->

            <div class="total-card">

                <span>
                    💰 Total Amount
                </span>

                <strong>
                    ₹{{ total|floatformat:2 }}
                </strong>

            </div>


            <!-- Payment -->

            <button
                type="submit"
                class="payment-btn">

                💳 Continue to Payment

            </button>

        </form>


        <!-- Back -->

        <a href="/" class="back-home">
            ← Back to Home
        </a>

    </div>

</div>

{% endblock %}
