{% extends 'foodapp/base.html' %}

{% block content %}

<div class="text-center mb-5">
    <h1 class="restaurant-title">
        🍽 RESTAURANTS
    </h1>

    <p class="subtitle">
        Delicious food from your favorite restaurants
    </p>
</div>

<div class="row">

    {% for restaurant in restaurants %}

    <div class="col-md-4 mb-4">

        <div class="card restaurant-card">

            <div class="card-body text-center">

                <div class="restaurant-icon">
                    🍲
                </div>

                <h3 class="card-title">
                    {{ restaurant.name }}
                </h3>

                <p class="location">
                    📍 {{ restaurant.location }}
                </p>

            <a href="{% url 'menu' restaurant.id %}"
                class="btn menu-btn">
                📖 View Menu
            </a>

            </div>

        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
